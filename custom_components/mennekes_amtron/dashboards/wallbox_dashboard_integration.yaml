# Wallbox-Dashboard, Variante 2 — ausschliesslich auf die Entitaeten der Integration gemappt.
# Benoetigt keine Template-Sensoren, Helfer oder Python-Scripts des YAML-Teils und zeigt
# deshalb keine "Entitaet nicht gefunden"-Karten.
#
# Einrichtung: Dashboard mit der URL dashboard-wallbox anlegen, dann diesen Inhalt im
# Rohkonfigurationseditor einfuegen. Anleitung: siehe README.md.
#
# Vollversion mit Systemereignis-Filter und Fahrzeugzuordnung: wallbox_dashboard.yaml
title: Mennekes AMTRON Wallbox (Integration)
icon: mdi:ev-station
views:
- title: Übersicht
  path: wallbox-main
  icon: mdi:lightning-bolt
  cards:
  - type: entities
    title: Status
    icon: mdi:ev-station
    entities:
    - entity: sensor.mennekes_amtron_charging_status
      name: Ladestatus
    - entity: sensor.mennekes_amtron_vehicle_state
      name: Fahrzeugzustand
    - entity: sensor.mennekes_amtron_phase_switch_mode
      name: Phasenumschaltung
    - entity: switch.mennekes_amtron_cp_availability
      name: Verfügbarkeit
  - type: conditional
    conditions:
    - condition: state
      entity: sensor.mennekes_amtron_charging_status
      state: Charging
    card:
      type: entities
      title: Aktuelle Ladesession
      icon: mdi:battery-charging
      entities:
      - entity: sensor.mennekes_amtron_session_energy
        name: Geladene Energie
      - entity: sensor.mennekes_amtron_session_duration
        name: Ladedauer
      - entity: sensor.mennekes_amtron_total_power
        name: Ladeleistung
      - entity: sensor.mennekes_amtron_signaled_current
        name: Signalisierter Strom
      - entity: sensor.mennekes_amtron_max_current_ev
        name: Max. Strom Fahrzeug
  - type: conditional
    conditions:
    - condition: state
      entity: sensor.mennekes_amtron_charging_status
      state_not: Charging
    card:
      type: entities
      title: Letzte Ladesession
      icon: mdi:battery-outline
      entities:
      - entity: sensor.mennekes_amtron_last_session_energy
        name: Geladene Energie
      - entity: sensor.mennekes_amtron_last_vehicle
        name: Fahrzeug
      - entity: sensor.mennekes_amtron_session_duration
        name: Ladedauer
  - type: entities
    title: Energie (kWh)
    icon: mdi:counter
    entities:
    - entity: sensor.mennekes_amtron_total_energy
      name: Zählerstand gesamt
    - entity: sensor.mennekes_amtron_energy_l1
      name: Energie L1
    - entity: sensor.mennekes_amtron_energy_l2
      name: Energie L2
    - entity: sensor.mennekes_amtron_energy_l3
      name: Energie L3
  - type: entities
    title: Leistung (W)
    icon: mdi:flash
    entities:
    - entity: sensor.mennekes_amtron_total_power
      name: Gesamtleistung
    - entity: sensor.mennekes_amtron_power_l1
      name: Leistung L1
    - entity: sensor.mennekes_amtron_power_l2
      name: Leistung L2
    - entity: sensor.mennekes_amtron_power_l3
      name: Leistung L3
  - type: entities
    title: Spannung & Strom
    icon: mdi:sine-wave
    entities:
    - entity: sensor.mennekes_amtron_voltage_l1
      name: Spannung L1
    - entity: sensor.mennekes_amtron_voltage_l2
      name: Spannung L2
    - entity: sensor.mennekes_amtron_voltage_l3
      name: Spannung L3
    - entity: sensor.mennekes_amtron_current_l1
      name: Strom L1
    - entity: sensor.mennekes_amtron_current_l2
      name: Strom L2
    - entity: sensor.mennekes_amtron_current_l3
      name: Strom L3
  - type: entities
    title: Limits (gelesen)
    icon: mdi:speedometer
    entities:
    - entity: sensor.mennekes_amtron_hems_current_limit
      name: HEMS-Limit
    - entity: sensor.mennekes_amtron_safe_current
      name: Safe Current
    - entity: sensor.mennekes_amtron_signaled_current
      name: Signalisierter Strom
- title: History
  path: wallbox-history
  icon: mdi:history
  cards:
  - type: entities
    title: Summen
    icon: mdi:sigma
    entities:
    - entity: button.mennekes_amtron_refresh_charging_history
      name: Jetzt abrufen
    - entity: sensor.mennekes_amtron_total_sessions
      name: Ladevorgänge
    - entity: sensor.mennekes_amtron_total_charged_energy
      name: Geladene Energie gesamt
    - entity: sensor.mennekes_amtron_total_cost
      name: Kosten gesamt
    - entity: sensor.mennekes_amtron_last_session_energy
      name: Letzte Session
    - entity: sensor.mennekes_amtron_last_vehicle
      name: Letztes Fahrzeug
  - type: markdown
    title: Monatsübersicht
    content: '{% set months = state_attr(''sensor.mennekes_amtron_sessions_summary'',''monthly_summary'')
      %}

      {% set cur = state_attr(''sensor.mennekes_amtron_sessions_summary'',''currency'') or '''' %}

      {% if months %}

      | Monat | kWh | Kosten {{ cur }} |

      |---|---:|---:|

      {% for m in months %}| {{ m.month }} | {{ ''%.1f'' | format(m.kwh) }} | {{ ''%.2f'' | format(m.cost)
      }} |

      {% endfor %}

      {% else %}

      *Noch keine Daten — die Ladehistorie wird stündlich über die REST-API der Wallbox geholt.*

      {% endif %}'
  - type: markdown
    title: Nach Fahrzeug
    content: '{% set totals = state_attr(''sensor.mennekes_amtron_sessions_summary'',''vehicle_totals'')
      %}

      {% set cur = state_attr(''sensor.mennekes_amtron_sessions_summary'',''currency'') or '''' %}

      {% if totals %}

      | Fahrzeug | kWh | Kosten {{ cur }} |

      |---|---:|---:|

      {% for name, v in totals.items() %}| {{ name }} | {{ ''%.1f'' | format(v.kwh) }} | {{ ''%.2f'' |
      format(v.cost) }} |

      {% endfor %}

      {% else %}

      *Noch keine Daten.*

      {% endif %}'
  - type: markdown
    title: Letzte Ladevorgänge
    content: '{% set sessions = state_attr(''sensor.mennekes_amtron_sessions_summary'',''sessions'') %}

      {% set cur = state_attr(''sensor.mennekes_amtron_sessions_summary'',''currency'') or '''' %}

      {% if sessions %}

      | Start | Fahrzeug | kWh | Kosten {{ cur }} |

      |---|---|---:|---:|

      {% for s in sessions[:20] %}| {{ s.start[:16] | replace(''T'','' '') }} | {{ s.vehicle }} | {{ ''%.2f''
      | format(s.energy_kwh) }} | {{ ''%.2f'' | format(s.cost) }} |

      {% endfor %}

      {% else %}

      *Noch keine Daten.*

      {% endif %}'
- title: Systemereignisse
  path: wallbox-systemlogs
  icon: mdi:text-box-search-outline
  cards:
  - type: horizontal-stack
    cards:
    - type: entities
      title: Status
      icon: mdi:database-clock
      entities:
      - entity: sensor.mennekes_amtron_system_events
        name: Einträge
      - entity: button.mennekes_amtron_refresh_system_events
        name: Aktualisieren
    - type: entities
      title: Filter
      icon: mdi:filter-variant
      entities:
      - entity: select.mennekes_amtron_event_level_filter
        name: Level
      - entity: select.mennekes_amtron_event_id_filter
        name: Event-ID
      - entity: text.mennekes_amtron_event_search
        name: Beschreibung
  - type: markdown
    title: Systemereignisse
    content: "{% set events = state_attr('sensor.mennekes_amtron_system_events','events') %}\n{% set level\
      \ = states('select.mennekes_amtron_event_level_filter') %}\n{% set evid = states('select.mennekes_amtron_event_id_filter')\
      \ %}\n{% set needle = states('text.mennekes_amtron_event_search') | lower %}\n{% set skip = ['All',\
      \ 'unknown', 'unavailable', ''] %}\n{% if events %}\n{% set ns = namespace(rows=[]) %}\n{% for e\
      \ in events %}\n{% if (level in skip or e.level == level)\n   and (evid in skip or e.event_id ==\
      \ evid)\n   and (needle in skip or needle in e.description | lower) %}\n{% set ns.rows = ns.rows\
      \ + [e] %}\n{% endif %}\n{% endfor %}\n**{{ ns.rows | length }}** von {{ events | length }} geladenen\
      \ Ereignissen (Wallbox insgesamt: {{ states('sensor.mennekes_amtron_system_events') }})\n\n| Zeit\
      \ | Level | Event-ID | Beschreibung |\n|---|---|---|---|\n{% for e in ns.rows[:40] %}| {{ e.timestamp[:19]\
      \ | replace('T',' ') }} | {{ e.level }} | {{ e.event_id }} | {{ e.description }} |\n{% endfor %}\n\
      {% else %}\n*Noch keine Daten - Button Aktualisieren druecken.*\n{% endif %}"
- title: Konfiguration
  path: wallbox-config
  icon: mdi:cog
  cards:
  - type: entities
    title: Fahrzeug zuweisen
    icon: mdi:card-account-details-outline
    entities:
    - entity: select.mennekes_amtron_rfid
      name: RFID auswählen
    - entity: text.mennekes_amtron_vehicle_name
      name: Fahrzeugname
    - entity: button.mennekes_amtron_assign_vehicle
      name: Zuweisen
  - type: markdown
    title: Bekannte Fahrzeuge
    content: '{% set v = state_attr(''sensor.mennekes_amtron_known_vehicles'',''vehicles'') %}

      {% set totals = state_attr(''sensor.mennekes_amtron_known_vehicles'',''vehicle_totals'') %}

      {% set cur = state_attr(''sensor.mennekes_amtron_known_vehicles'',''currency'') or '''' %}

      {% if v %}

      | RFID | Fahrzeug | kWh | Kosten {{ cur }} |

      |---|---|---:|---:|

      {% for rfid, name in v.items() %}{% set t = (totals or {}).get(name, {}) %}| `{{ rfid }}` | {{ name
      }} | {{ ''%.1f'' | format(t.get(''kwh'', 0)) }} | {{ ''%.2f'' | format(t.get(''cost'', 0)) }} |

      {% endfor %}

      {% else %}

      *Noch keine Zuordnung. RFID oben auswaehlen, Namen eingeben, Zuweisen druecken.*

      {% endif %}'
  - type: entities
    title: Wallbox-Einstellungen
    icon: mdi:tune
    entities:
    - entity: number.mennekes_amtron_hems_current_limit
      name: HEMS-Limit
    - entity: number.mennekes_amtron_safe_current
      name: Safe Current
    - entity: number.mennekes_amtron_communication_timeout
      name: Kommunikations-Timeout
    - entity: switch.mennekes_amtron_pause_charging
      name: Ladevorgang pausieren
    - entity: switch.mennekes_amtron_cp_availability
      name: Verfügbarkeit
  - type: entities
    title: Daten & Integration
    icon: mdi:information-outline
    entities:
    - entity: button.mennekes_amtron_refresh_charging_history
      name: Ladehistorie abrufen
    - entity: sensor.mennekes_amtron_sessions_summary
      name: Ladehistorie
    - entity: sensor.mennekes_amtron_known_vehicles
      name: Zugeordnete Fahrzeuge
    - entity: update.mennekes_amtron_wallbox_update
      name: Update
  - type: markdown
    title: Strompreis & Intervall
    content: 'Strompreis und Aktualisierungsintervall werden über die Integration gepflegt:


      **Einstellungen → Geräte & Dienste → Mennekes AMTRON → Konfigurieren**


      Die Ladehistorie wird nur auf Knopfdruck abgerufen — der Button oben löst sie aus.'
