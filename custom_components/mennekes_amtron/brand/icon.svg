<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Wallbox body -->
  <rect x="8" y="4" width="32" height="35" rx="3" fill="#1a1a2e" stroke="#41BDF5" stroke-width="1"/>

  <!-- Display -->
  <rect x="11" y="7" width="26" height="10" rx="2" fill="#0f3460" stroke="#41BDF5" stroke-width="0.8"/>
  <rect x="12" y="8" width="24" height="2" rx="1" fill="#41BDF5" opacity="0.3"/>

  <!-- LEDs -->
  <circle cx="15" cy="24" r="1.5" fill="#00ff00"/>
  <circle cx="24" cy="24" r="1.5" fill="#FFD700"/>
  <circle cx="33" cy="24" r="1.5" fill="#ff4444"/>

  <!-- Charging port -->
  <rect x="13" y="30" width="22" height="5" rx="1.5" fill="#333" stroke="#41BDF5" stroke-width="0.8"/>
  <circle cx="19" cy="32.5" r="1.2" fill="#666"/>
  <circle cx="29" cy="32.5" r="1.2" fill="#666"/>

  <!-- Lightning bolt -->
  <g transform="translate(24, 18)">
    <path d="M 0 -5 L -1.5 -1.5 L 0 -1.5 L -2.5 2.5 L 0 2.5 L -1 6 L 3 -2.5 L 1.5 -2.5 Z" fill="#FFD700"/>
  </g>
</svg>
